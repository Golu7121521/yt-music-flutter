name: yt_stream_player
description: An educational open-source YouTube audio streaming application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  youtube_explode_dart: ^2.2.1
  just_audio: ^0.9.40
  audio_video_progress_bar: ^2.0.3
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  audio_session: ^0.1.19
  rxdart: ^0.27.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
